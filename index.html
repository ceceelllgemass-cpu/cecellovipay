<!DOCTYPE html>
<html lang="id">
    <head>
            <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Untuk Rievaldi dari Cecel ❤️</title>
                        <style>
                                    * {
                                                    margin: 0;
                                                                padding: 0;
                                                                            box-sizing: border-box;
                                                                                        font-family: 'Poppins', sans-serif;
                                    }

                                            body {
                                                            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
                                                                        height: 100vh;
                                                                                    display: flex;
                                                                                                justify-content: center;
                                                                                                            align-items: center;
                                                                                                                        overflow: hidden;
                                                                                                                                    position: relative;
                                            }

                                                    /* Container Utama */
                                                            .card {
                                                                            background: rgba(255, 255, 255, 0.85);
                                                                                        backdrop-filter: blur(8px);
                                                                                                    padding: 30px 25px;
                                                                                                                border-radius: 20px;
                                                                                                                            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                                                                                                                                        text-align: center;
                                                                                                                                                    max-width: 400px;
                                                                                                                                                                width: 90%;
                                                                                                                                                                            z-index: 10;
                                                                                                                                                                                        position: relative;
                                                            }

                                                                    /* GIF / Gambar Lucu */
                                                                            .gif-container img {
                                                                                            width: 130px;
                                                                                                        height: 130px;
                                                                                                                    object-fit: cover;
                                                                                                                                border-radius: 50%;
                                                                                                                                            margin-bottom: 15px;
                                                                                                                                                        animation: bounce 2s infinite;
                                                                            }

                                                                                    @keyframes bounce {
                                                                                                    0%, 100% { transform: translateY(0); }
                                                                                                                50% { transform: translateY(-10px); }
                                                                                    }

                                                                                            h1 {
                                                                                                            color: #d63384;
                                                                                                                        font-size: 1.5rem;
                                                                                                                                    margin-bottom: 10px;
                                                                                            }

                                                                                                    .typewriter {
                                                                                                                    font-size: 0.95rem;
                                                                                                                                color: #444;
                                                                                                                                            min-height: 80px;
                                                                                                                                                        margin-bottom: 20px;
                                                                                                                                                                    line-height: 1.5;
                                                                                                    }

                                                                                                            /* Tombol Interaktif */
                                                                                                                    .btn-group {
                                                                                                                                    display: flex;
                                                                                                                                                justify-content: center;
                                                                                                                                                            gap: 15px;
                                                                                                                    }

                                                                                                                            button {
                                                                                                                                            padding: 10px 20px;
                                                                                                                                                        border: none;
                                                                                                                                                                    border-radius: 25px;
                                                                                                                                                                                font-size: 0.9rem;
                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                    transition: transform 0.2s, background 0.3s;
                                                                                                                            }

                                                                                                                                    .btn-love {
                                                                                                                                                    background-color: #ff4757;
                                                                                                                                                                color: white;
                                                                                                                                                                            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
                                                                                                                                    }

                                                                                                                                            .btn-love:hover {
                                                                                                                                                            transform: scale(1.1);
                                                                                                                                                                        background-color: #ff6b81;
                                                                                                                                            }

                                                                                                                                                    /* Animasi Hati Terbang */
                                                                                                                                                            .heart {
                                                                                                                                                                            position: absolute;
                                                                                                                                                                                        color: #ff4757;
                                                                                                                                                                                                    font-size: 20px;
                                                                                                                                                                                                                animation: floatUp 4s linear infinite;
                                                                                                                                                                                                                            bottom: -20px;
                                                                                                                                                                                                                                        opacity: 0.7;
                                                                                                                                                            }

                                                                                                                                                                    @keyframes floatUp {
                                                                                                                                                                                    0% {
                                                                                                                                                                                                        transform: translateY(0) rotate(0deg);
                                                                                                                                                                                                                        opacity: 1;
                                                                                                                                                                                    }
                                                                                                                                                                                                100% {
                                                                                                                                                                                                                    transform: translateY(-100vh) rotate(360deg);
                                                                                                                                                                                                                                    opacity: 0;
                                                                                                                                                                                                }
                                                                                                                                                                                            }
                                                                                                                                                                                        </style>
                                                                                                                                                                                    </head>
                                                                                                                                                                                    <body>

                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                        <div class="gif-container">
                                                                                                                                                                                                                        <!-- Gambar GIF Beruang Lucu -->
                                                                                                                                                                                                                                <img id="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pueHowaGFzcTNicW4zZjV2ZTg4dm9sa3h2ZXZydGNvZzJicnpxZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L3X9GvEGEYBSRlq4fg/giphy.gif" alt="Cute Bear">
                                                                                                                                                                                                        </div>
                                                                                                                                                                                                            <h1>Halo, Rievaldi! 💖</h1>
                                                                                                                                                                                                                <div class="typewriter" id="text"></div>
                                                                                                                                                                                                                    
                                                                                                                                                                                                                    <div class="btn-group">
                                                                                                                                                                                                                                    <button class="btn-love" onclick="kirimCinta()">Klik Ini Deh ✨</button>
                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                </div>
                                                                                                                                                                                                            
                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                            // Pesan Romantis dari Cecel
                                                                                                                                                                                                                                const message = "Terima kasih ya sudah selalu ada dan bikin hari-hari Cecel jadi lebih manis. Rievaldi jangan lupa senyum hari ini, karena senyum kamu itu favoritnya Cecel! 💌✨";
                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                    let index = 0;
                                                                                                                                                                                                                                        const speed = 50;
                                                                                                                                                                                                                                            const textContainer = document.getElementById("text");
                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                // Efek Mengetik Otomatis
                                                                                                                                                                                                                                                    function typeWriter() {
                                                                                                                                                                                                                                                                    if (index < message.length) {
                                                                                                                                                                                                                                                                                        textContainer.innerHTML += message.charAt(index);
                                                                                                                                                                                                                                                                                                        index++;
                                                                                                                                                                                                                                                                                                                        setTimeout(typeWriter, speed);
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                        // Fungsi saat tombol diklik
                                                                                                                                                                                                                                                                                function kirimCinta() {
                                                                                                                                                                                                                                                                                                alert("Cecel sayang Rievaldi banyak-banyak! 🥰❤️");
                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                            // Meledakkan banyak hati saat diklik
                                                                                                                                                                                                                                                                                                                        for (let i = 0; i < 15; i++) {
                                                                                                                                                                                                                                                                                                                                            setTimeout(createHeart, i * 100);
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                            // Membuat Animasi Hati Terbang
                                                                                                                                                                                                                                                                                                                                    function createHeart() {
                                                                                                                                                                                                                                                                                                                                                    const heart = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                heart.classList.add("heart");
                                                                                                                                                                                                                                                                                                                                                                            heart.innerHTML = "❤️";
                                                                                                                                                                                                                                                                                                                                                                                        heart.style.left = Math.random() * 100 + "vw";
                                                                                                                                                                                                                                                                                                                                                                                                    heart.style.animationDuration = Math.random() * 2 + 3 + "s";
                                                                                                                                                                                                                                                                                                                                                                                                                heart.style.fontSize = Math.random() * 15 + 15 + "px";
                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                            document.body.appendChild(heart);

                                                                                                                                                                                                                                                                                                                                                                                                                                        setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                            heart.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                        }, 5000);
                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                            // Jalankan Efek
                                                                                                                                                                                                                                                                                                                                                                                                                                                    setInterval(createHeart, 400);
                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.onload = typeWriter;
                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                        })
                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                    }-->
                                                                                                                                                                                                }
                                                                                                                                                                                    }
                                                                                                                                                                    }
                                                                                                                                                            }
                                                                                                                                            }
                                                                                                                                    }
                                                                                                                            }
                                                                                                                    }
                                                                                                    }
                                                                                            }
                                                                                    }
                                                                            }
                                                            }
                                            }
                                    }
